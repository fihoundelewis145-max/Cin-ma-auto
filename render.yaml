services:
  - type: web
    name: cinema-auto
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: cinema-auto-db
          property: connectionString
      - key: PUBLIC_BASE_URL
        value: https://cinema-auto.onrender.com
      - key: AUTO_SEARCH_ENABLED
        value: "true"
      - key: METRICOOL_API_TOKEN
        sync: false
      - key: METRICOOL_USER_ID
        sync: false
      - key: METRICOOL_BLOG_ID
        value: "8413347"
      - key: METRICOOL_TIMEZONE
        value: Africa/Porto-Novo
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false

databases:
  - name: cinema-auto-db
    databaseName: cinema_auto
    user: cinema_auto
    plan: free
    postgresMajorVersion: "16"
